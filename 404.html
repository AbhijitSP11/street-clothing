<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Page not found</title>
<style>
:root{--bg:#F4F4F1;--ink:#16181A;--muted:#62686B}
@media (prefers-color-scheme:dark){:root{--bg:#101112;--ink:#ECEEEC;--muted:#9AA09E;color-scheme:dark}}
body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:var(--bg);color:var(--ink);
  font-family:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;line-height:1.55;text-align:center}
h1{margin:0 0 8px;font-size:clamp(28px,6vw,44px);letter-spacing:-.02em}
p{margin:0 0 20px;color:var(--muted)}
a{color:inherit;font-weight:600}
</style>
</head>
<body>
<main>
  <h1>Page not found</h1>
  <p>That page doesn't exist, or it has moved.</p>
  <a href="/">Back to the storefronts</a>
</main>
</body>
</html>
